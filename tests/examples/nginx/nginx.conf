server {
    listen 80;
    listen [::]:80;
    server_name example.com

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate /ssl/example.com/cert.pem;
    ssl_certificate_key /ssl/example.com/key.pem;

    include /opt/shurl/nginx/projects/*.conf;
}
